<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Quest - Quiz Engine</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --panel-border: #334155;
      --accent-blue: #3b82f6;
      --accent-gold: #eab308;
      --accent-green: #10b981;
      --accent-purple: #a855f7;
      --accent-cyan: #06b6d4;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }

    /* Header & Navigation */
    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .brand-title { font-size: 1.4rem; font-weight: 700; color: #fff; }
    
    .stats-bar {
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: #0f172a;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid var(--panel-border);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .stat-badge.coins { color: var(--accent-gold); border-color: rgba(234, 179, 8, 0.4); }
    .stat-badge.coins.pulse-gold {
      animation: goldPulse 0.8s ease-in-out infinite alternate;
    }

    .btn {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.2rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary { background: var(--accent-blue); color: white; }
    .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
    .btn-shop { background: #8b5cf6; color: white; }
    .btn-shop:hover { background: #7c3aed; transform: translateY(-1px); }

    /* Main Container */
    main {
      width: 100%;
      max-width: 900px;
      position: relative;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* Active Power-up Visual FX on Main Card */
    .card.shield-active {
      border-color: var(--accent-purple);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
      animation: shieldGlow 2s infinite alternate;
    }

    .card.frost-active {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
    }

    .frost-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.05) 0%, rgba(6, 182, 212, 0.15) 100%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 5;
    }
    .card.frost-active .frost-overlay { opacity: 1; }

    /* Timer Bar */
    .timer-container {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .timer-bar {
      height: 100%;
      width: 100%;
      background: var(--accent-blue);
      transition: width 1s linear, background-color 0.3s;
    }
    .card.frost-active .timer-bar { background: var(--accent-cyan); }

    /* Question & Options */
    .level-indicator {
      color: var(--accent-blue);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .question-text {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 640px) {
      .options-grid { grid-template-columns: 1fr; }
    }

    .option-btn {
      background: #0f172a;
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 1rem 1.2rem;
      border-radius: 10px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent-blue);
      background: #1e293b;
      transform: translateY(-2px);
    }

    .option-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--accent-green); color: #34d399; }
    .option-btn.incorrect { background: rgba(239, 68, 68, 0.2); border-color: var(--accent-red); color: #f87171; }
    
    .option-btn.option-eliminated {
      opacity: 0.2;
      transform: scale(0.95);
      pointer-events: none;
      filter: blur(1px);
      transition: all 0.4s ease;
    }

    .option-btn.smart-hint-highlight {
      border-color: var(--accent-gold);
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.3);
    }

    /* In-Game Power-Up Toolbar */
    .powerup-toolbar {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      padding-top: 1rem;
      border-top: 1px solid var(--panel-border);
    }

    .powerup-btn {
      background: #0f172a;
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 0.5rem 0.9rem;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      position: relative;
    }

    .powerup-btn:hover:not(:disabled) {
      border-color: var(--accent-blue);
      transform: translateY(-2px);
    }

    .powerup-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .powerup-btn .badge {
      background: var(--accent-blue);
      color: white;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 10px;
    }

    /* Marketplace Modal */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.open { opacity: 1; pointer-events: auto; }

    .shop-modal {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      width: 90%;
      max-width: 650px;
      padding: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }

    .modal-backdrop.open .shop-modal { transform: translateY(0); }

    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 580px) {
      .shop-grid { grid-template-columns: 1fr; }
    }

    .shop-item {
      background: #0f172a;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }

    .shop-item:hover {
      border-color: var(--accent-gold);
      box-shadow: 0 4px 15px rgba(234, 179, 8, 0.15);
      transform: translateY(-2px);
    }

    .shop-item.purchased-anim {
      animation: buyBounce 0.4s ease-out;
    }

    .shop-item-title { font-weight: 700; font-size: 1rem; margin-bottom: 0.2rem; display: flex; align-items: center; gap: 0.4rem; }
    .shop-item-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.8rem; }
    .shop-item-footer { display: flex; justify-content: space-between; align-items: center; }
    .shop-price { color: var(--accent-gold); font-weight: 700; display: flex; align-items: center; gap: 0.2rem; }

    /* Animations */
    @keyframes goldPulse {
      from { box-shadow: 0 0 5px rgba(234, 179, 8, 0.2); }
      to { box-shadow: 0 0 18px rgba(234, 179, 8, 0.6); }
    }

    @keyframes shieldGlow {
      from { box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); }
      to { box-shadow: 0 0 30px rgba(168, 85, 247, 0.6); }
    }

    @keyframes buyBounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); border-color: var(--accent-green); }
      100% { transform: scale(1); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header Stats Bar -->
  <header>
    <div class="brand-title">Knowledge Quest</div>
    <div class="stats-bar">
      <div class="stat-badge coins" id="coins-display">🪙 150</div>
      <div class="stat-badge" id="score-display">⭐ Score: 0</div>
      <button class="btn btn-shop" id="open-shop-btn">🛒 Shop</button>
      <label style="cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 0.3rem;">
        <input type="checkbox" id="ambient-toggle"> 🎵 Ambient
      </label>
    </div>
  </header>

  <!-- Main Game Container -->
  <main>
    <!-- Start / Level Selector View -->
    <div id="view-start" class="card">
      <h2 style="margin-bottom: 1rem;">Select Quest Level</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Earn coins by answering questions correctly and equip power-ups to tackle tough challenges!</p>
      <div id="level-list" style="display: flex; flex-direction: column; gap: 1rem;"></div>
    </div>

    <!-- Active Quiz View -->
    <div id="view-quiz" class="card hidden">
      <div class="frost-overlay"></div>
      
      <div class="timer-container">
        <div class="timer-bar" id="timer-bar"></div>
      </div>

      <div class="level-indicator" id="level-title">Level 1</div>
      <div class="question-text" id="question-text">Question loading...</div>

      <div class="options-grid" id="options-grid"></div>

      <!-- In-Game Powerup Activation Toolbar -->
      <div class="powerup-toolbar" id="powerup-toolbar"></div>
    </div>

    <!-- Level Completion View -->
    <div id="view-complete" class="card hidden" style="text-align: center;">
      <h2 style="font-size: 2rem; color: var(--accent-green); margin-bottom: 0.5rem;">Level Complete!</h2>
      <p id="complete-summary" style="color: var(--text-muted); margin-bottom: 1.5rem;">You cleared the level!</p>
      <button class="btn btn-primary" id="continue-btn">Continue to Map</button>
    </div>
  </main>

  <!-- Marketplace Modal Store -->
  <div class="modal-backdrop" id="shop-modal">
    <div class="shop-modal">
      <div class="shop-header">
        <h2>Power-Up Store</h2>
        <button class="btn" style="background: transparent; color: var(--text-muted); font-size: 1.2rem;" id="close-shop-btn">✕</button>
      </div>
      <div class="shop-grid" id="shop-grid"></div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. SYNTHESIZED AUDIO ENGINE (Web Audio API)
       ========================================================================== */
    class AudioManager {
      constructor() {
        this.ctx = null;
        this.ambientGain = null;
        this.ambientOscillators = [];
        this.ambientLfo = null;
        this.isAmbientPlaying = false;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playCorrect() {
        this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        const now = this.ctx.currentTime;
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.06);
          gain.gain.setValueAtTime(0.15, now + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.06);
          osc.stop(now + idx * 0.06 + 0.25);
        });
      }

      playCoin() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(987.77, now);
        osc.frequency.setValueAtTime(1318.51, now + 0.07);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }

      playPurchase() {
        this.init();
        const now = this.ctx.currentTime;
        [783.99, 987.77, 1174.66, 1567.98].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.025);
          gain.gain.setValueAtTime(0.12, now + idx * 0.025);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.025 + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.025);
          osc.stop(now + idx * 0.025 + 0.35);
        });
      }

      playPowerup() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }

      startAmbient() {
        this.init();
        if (this.isAmbientPlaying) return;
        const now = this.ctx.currentTime;
        this.ambientGain = this.ctx.createGain();
        this.ambientGain.gain.setValueAtTime(0.001, now);
        this.ambientGain.gain.linearRampToValueAtTime(0.05, now + 2);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(280, now);

        this.ambientLfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        this.ambientLfo.frequency.setValueAtTime(0.15, now);
        lfoGain.gain.setValueAtTime(80, now);
        this.ambientLfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);
        this.ambientLfo.start(now);

        this.ambientOscillators = [110.00, 164.81, 220.00, 277.18].map((freq) => {
          const osc = this.ctx.createOscillator();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          osc.connect(filter);
          osc.start(now);
          return osc;
        });

        filter.connect(this.ambientGain);
        this.ambientGain.connect(this.ctx.destination);
        this.isAmbientPlaying = true;
      }

      stopAmbient() {
        if (!this.isAmbientPlaying || !this.ambientGain) return;
        const now = this.ctx.currentTime;
        this.ambientGain.gain.linearRampToValueAtTime(0.0001, now + 1.5);
        setTimeout(() => {
          this.ambientOscillators.forEach((osc) => osc.stop());
          if (this.ambientLfo) this.ambientLfo.stop();
          this.ambientOscillators = [];
          this.isAmbientPlaying = false;
        }, 1500);
      }
    }

    const audioManager = new AudioManager();

    /* ==========================================================================
       2. LEVEL ARCHITECTURE & QUESTION BANK DATA
       ========================================================================== */
    const levelData = [
      {
        level: 1,
        title: "Level 1: Foundations & Fundamentals",
        questions: [
          {
            id: "l1_q1",
            question: "In personal finance literature (e.g., 'Rich Dad Poor Dad'), how is an 'Asset' defined?",
            options: [
              "Anything that puts money into your pocket",
              "Any property or vehicle you own outright",
              "Your primary residential home",
              "Items purchased with high liability value"
            ],
            correctIndex: 0
          },
          {
            id: "l1_q2",
            question: "Which web standard is specifically used for synthesizing audio on-the-fly in browser games?",
            options: [
              "Web Audio API",
              "HTML5 <audio> tag element",
              "WebRTC Audio Stream",
              "Canvas Sound Rendering"
            ],
            correctIndex: 0
          }
        ]
      },
      {
        level: 2,
        title: "Level 2: Development & Sustainability",
        questions: [
          {
            id: "l2_q1",
            question: "What primary energy source powers decentralized cold-storage hubs for rural agricultural preservation?",
            options: [
              "Solar Photovoltaic (PV) Systems",
              "Diesel Generator Units",
              "Geothermal Heat Exchanges",
              "Grid Thermal Turbines"
            ],
            correctIndex: 0
          },
          {
            id: "l2_q2",
            question: "Which city hosts the historical Kwame Nkrumah Memorial Park and Mausoleum?",
            options: [
              "Accra",
              "Kumasi",
              "Cape Coast",
              "Tamale"
            ],
            correctIndex: 0
          }
        ]
      },
      {
        level: 3,
        title: "Level 3: Web Architecture & Advanced Concepts",
        questions: [
          {
            id: "l3_q1",
            question: "In modern frontend web design, which utility-first CSS framework relies on classes like 'flex', 'pt-4', and 'text-center'?",
            options: [
              "Tailwind CSS",
              "Bootstrap",
              "Bulma",
              "Foundation"
            ],
            correctIndex: 0
          },
          {
            id: "l3_q2",
            question: "When running procedural 3D modeling scripts in Blender, which scripting language is natively embedded?",
            options: [
              "Python",
              "JavaScript",
              "C++",
              "Lua"
            ],
            correctIndex: 0
          }
        ]
      }
    ];

    /* ==========================================================================
       3. POWER-UP MARKETPLACE CONFIGURATION
       ========================================================================== */
    const powerUpStore = [
      { id: 'fiftyFifty', name: '50/50 Eliminator', price: 50, icon: '⚡', desc: 'Removes 2 incorrect answer choices.' },
      { id: 'timeFreeze', name: 'Time Freeze', price: 75, icon: '❄️', desc: 'Adds +15s and pauses the question timer.' },
      { id: 'doubleCoins', name: 'Double Coins', price: 100, icon: '🪙', desc: 'Doubles coin rewards for the current level.' },
      { id: 'shield', name: 'Second Chance Shield', price: 120, icon: '🛡️', desc: 'Protects against loss on your first wrong answer.' },
      { id: 'smartHint', name: 'Smart Hint', price: 60, icon: '💡', desc: 'Highlights one incorrect choice to ignore.' }
    ];

    /* ==========================================================================
       4. GAME STATE MANAGEMENT & LOGIC
       ========================================================================== */
    const gameState = {
      coins: 150,
      score: 0,
      inventory: {
        fiftyFifty: 1,
        timeFreeze: 1,
        doubleCoins: 0,
        shield: 0,
        smartHint: 1
      },
      activeEffects: {
        doubleCoins: false,
        shield: false,
        timeFreeze: false
      },
      currentLevelIdx: 0,
      currentQuestionIdx: 0,
      timer: 20,
      timerInterval: null
    };

    // DOM Elements
    const coinsDisplay = document.getElementById('coins-display');
    const scoreDisplay = document.getElementById('score-display');
    const shopModal = document.getElementById('shop-modal');
    const shopGrid = document.getElementById('shop-grid');
    const viewStart = document.getElementById('view-start');
    const viewQuiz = document.getElementById('view-quiz');
    const viewComplete = document.getElementById('view-complete');
    const levelList = document.getElementById('level-list');
    const mainCard = document.querySelector('#view-quiz.card');

    function updateStatsUI() {
      coinsDisplay.textContent = `🪙 ${gameState.coins}`;
      scoreDisplay.textContent = `⭐ Score: ${gameState.score}`;
      if (gameState.activeEffects.doubleCoins) {
        coinsDisplay.classList.add('pulse-gold');
      } else {
        coinsDisplay.classList.remove('pulse-gold');
      }
    }

    /* --- Marketplace Logic --- */
    function renderShop() {
      shopGrid.innerHTML = '';
      powerUpStore.forEach(item => {
        const canAfford = gameState.coins >= item.price;
        const count = gameState.inventory[item.id] || 0;
        
        const el = document.createElement('div');
        el.className = 'shop-item';
        el.id = `shop-item-${item.id}`;
        el.innerHTML = `
          <div>
            <div class="shop-item-title">${item.icon} ${item.name}</div>
            <div class="shop-item-desc">${item.desc} (Owned: ${count})</div>
          </div>
          <div class="shop-item-footer">
            <div class="shop-price">🪙 ${item.price}</div>
            <button class="btn btn-primary" ${!canAfford ? 'disabled' : ''} onclick="buyPowerUp('${item.id}')">
              Buy
            </button>
          </div>
        `;
        shopGrid.appendChild(el);
      });
    }

    window.buyPowerUp = function(id) {
      const item = powerUpStore.find(p => p.id === id);
      if (item && gameState.coins >= item.price) {
        gameState.coins -= item.price;
        gameState.inventory[id] = (gameState.inventory[id] || 0) + 1;
        
        audioManager.playPurchase();
        updateStatsUI();
        renderShop();
        renderPowerUpToolbar();

        // Trigger pulse bounce animation on card
        const shopCard = document.getElementById(`shop-item-${id}`);
        if (shopCard) {
          shopCard.classList.add('purchased-anim');
          setTimeout(() => shopCard.classList.remove('purchased-anim'), 400);
        }
      }
    };

    /* --- Level Selector --- */
    function renderLevelSelector() {
      levelList.innerHTML = '';
      levelData.forEach((lvl, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn option-btn';
        btn.style.width = '100%';
        btn.innerHTML = `<strong>${lvl.title}</strong> (${lvl.questions.length} Questions)`;
        btn.onclick = () => startLevel(idx);
        levelList.appendChild(btn);
      });
    }

    /* --- Gameplay Logic --- */
    function startLevel(idx) {
      gameState.currentLevelIdx = idx;
      gameState.currentQuestionIdx = 0;
      gameState.activeEffects.doubleCoins = false;
      gameState.activeEffects.shield = false;
      gameState.activeEffects.timeFreeze = false;
      
      viewStart.classList.add('hidden');
      viewComplete.classList.add('hidden');
      viewQuiz.classList.remove('hidden');

      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(gameState.timerInterval);
      gameState.activeEffects.timeFreeze = false;
      mainCard.classList.remove('frost-active');

      const currentLvl = levelData[gameState.currentLevelIdx];
      const q = currentLvl.questions[gameState.currentQuestionIdx];

      document.getElementById('level-title').textContent = currentLvl.title;
      document.getElementById('question-text').textContent = q.question;

      const grid = document.getElementById('options-grid');
      grid.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.id = `option-${idx}`;
        btn.textContent = opt;
        btn.onclick = () => selectAnswer(idx);
        grid.appendChild(btn);
      });

      renderPowerUpToolbar();
      startTimer();
    }

    function startTimer() {
      gameState.timer = 15;
      const bar = document.getElementById('timer-bar');
      bar.style.width = '100%';

      gameState.timerInterval = setInterval(() => {
        if (!gameState.activeEffects.timeFreeze) {
          gameState.timer -= 1;
          bar.style.width = `${(gameState.timer / 15) * 100}%`;

          if (gameState.timer <= 0) {
            clearInterval(gameState.timerInterval);
            selectAnswer(-1); // Time out
          }
        }
      }, 1000);
    }

    function selectAnswer(selectedIdx) {
      clearInterval(gameState.timerInterval);
      const q = levelData[gameState.currentLevelIdx].questions[gameState.currentQuestionIdx];
      const isCorrect = selectedIdx === q.correctIndex;

      // Check Shield Power-Up
      if (!isCorrect && gameState.activeEffects.shield) {
        gameState.activeEffects.shield = false;
        mainCard.classList.remove('shield-active');
        audioManager.playPowerup();
        alert("🛡️ Second Chance Shield absorbed the wrong answer!");
        startTimer();
        return;
      }

      const options = document.querySelectorAll('.option-btn');
      options.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.correctIndex) btn.classList.add('correct');
        if (idx === selectedIdx && !isCorrect) btn.classList.add('incorrect');
      });

      if (isCorrect) {
        audioManager.playCorrect();
        let earnedCoins = 20;
        if (gameState.activeEffects.doubleCoins) earnedCoins *= 2;
        
        gameState.coins += earnedCoins;
        gameState.score += 100;
        audioManager.playCoin();
        updateStatsUI();
      }

      setTimeout(() => {
        gameState.currentQuestionIdx += 1;
        const currentLvl = levelData[gameState.currentLevelIdx];
        if (gameState.currentQuestionIdx < currentLvl.questions.length) {
          loadQuestion();
        } else {
          finishLevel();
        }
      }, 1500);
    }

    function finishLevel() {
      viewQuiz.classList.add('hidden');
      viewComplete.classList.remove('hidden');
      document.getElementById('complete-summary').textContent = 
        `You completed ${levelData[gameState.currentLevelIdx].title}! Total Score: ${gameState.score}`;
    }

    /* --- Power-Up Activations --- */
    function renderPowerUpToolbar() {
      const toolbar = document.getElementById('powerup-toolbar');
      toolbar.innerHTML = '';

      powerUpStore.forEach(item => {
        const count = gameState.inventory[item.id] || 0;
        const btn = document.createElement('button');
        btn.className = 'powerup-btn';
        btn.disabled = count <= 0;
        btn.innerHTML = `${item.icon} ${item.name} <span class="badge">${count}</span>`;
        btn.onclick = () => activatePowerUp(item.id);
        toolbar.appendChild(btn);
      });
    }

    function activatePowerUp(id) {
      if ((gameState.inventory[id] || 0) <= 0) return;

      const q = levelData[gameState.currentLevelIdx].questions[gameState.currentQuestionIdx];

      switch(id) {
        case 'fiftyFifty':
          gameState.inventory.fiftyFifty -= 1;
          audioManager.playPowerup();
          let removed = 0;
          for (let i = 0; i < q.options.length; i++) {
            if (i !== q.correctIndex && removed < 2) {
              const optBtn = document.getElementById(`option-${i}`);
              if (optBtn) optBtn.classList.add('option-eliminated');
              removed++;
            }
          }
          break;

        case 'timeFreeze':
          gameState.inventory.timeFreeze -= 1;
          gameState.activeEffects.timeFreeze = true;
          mainCard.classList.add('frost-active');
          audioManager.playPowerup();
          break;

        case 'doubleCoins':
          gameState.inventory.doubleCoins -= 1;
          gameState.activeEffects.doubleCoins = true;
          updateStatsUI();
          audioManager.playPowerup();
          break;

        case 'shield':
          gameState.inventory.shield -= 1;
          gameState.activeEffects.shield = true;
          mainCard.classList.add('shield-active');
          audioManager.playPowerup();
          break;

        case 'smartHint':
          gameState.inventory.smartHint -= 1;
          audioManager.playPowerup();
          for (let i = 0; i < q.options.length; i++) {
            if (i !== q.correctIndex) {
              const optBtn = document.getElementById(`option-${i}`);
              if (optBtn) {
                optBtn.classList.add('smart-hint-highlight');
                break;
              }
            }
          }
          break;
      }

      renderPowerUpToolbar();
    }

    /* --- Event Listeners & Init --- */
    document.getElementById('open-shop-btn').onclick = () => { renderShop(); shopModal.classList.add('open'); };
    document.getElementById('close-shop-btn').onclick = () => shopModal.classList.remove('open');
    document.getElementById('continue-btn').onclick = () => {
      viewComplete.classList.add('hidden');
      viewStart.classList.remove('hidden');
    };

    document.getElementById('ambient-toggle').onchange = (e) => {
      if (e.target.checked) audioManager.startAmbient();
      else audioManager.stopAmbient();
    };

    window.addEventListener('click', () => audioManager.init(), { once: true });

    // Initialize UI
    updateStatsUI();
    renderLevelSelector();
  </script>
</body>
</html>
