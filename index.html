<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Quest: Adventure & Tiered Trivia</title>
    <!-- p5.js Library for 2D Canvas Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(18, 22, 38, 0.72);
            --glass-border: rgba(255, 255, 255, 0.14);
            --accent-gold: #ffc107;
            --accent-gold-glow: rgba(255, 193, 7, 0.35);
            --accent-cyan: #00e5ff;
            --accent-purple: #a855f7;
            --danger-red: #ff4757;
            --success-green: #2ed573;
            --tier-easy: #2ed573;
            --tier-medium: #ff9f43;
            --tier-hard: #ff4757;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090c15;
            color: var(--text-main);
        }

        /* p5.js Canvas Container */
        #p5-canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Glassmorphism UI Root Overlay */
        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Reusable Glass Panel Styling */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        }

        /* Header HUD */
        header.hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1.25rem;
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }

        .hud-stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .hud-badge {
            background: rgba(255, 255, 255, 0.08);
            padding: 0.4rem 0.85rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .gold-text { color: var(--accent-gold); }
        .cyan-text { color: var(--accent-cyan); }
        .purple-text { color: var(--accent-purple); }

        /* Game Screens Switcher */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 520px;
            margin: auto;
            padding: 1.75rem;
            gap: 1.25rem;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.3px;
        }

        .card-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Tier Pill Badge */
        .tier-badge {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: inline-block;
        }

        .tier-badge.tier-1 { color: var(--tier-easy); border-color: var(--tier-easy); }
        .tier-badge.tier-2 { color: var(--tier-medium); border-color: var(--tier-medium); }
        .tier-badge.tier-3 { color: var(--tier-hard); border-color: var(--tier-hard); }

        /* Quiz UI Elements */
        .timer-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 0.25rem;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-gold));
            transition: width 0.1s linear;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.5;
            text-align: center;
            margin: 0.25rem 0 0.75rem 0;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            padding: 0.9rem 1.25rem;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent-cyan);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: rgba(46, 213, 115, 0.25) !important;
            border-color: var(--success-green) !important;
        }

        .option-btn.wrong {
            background: rgba(255, 71, 87, 0.25) !important;
            border-color: var(--danger-red) !important;
        }

        /* Power-Up Quick Marketplace Bar */
        .powerup-bar {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            justify-content: space-between;
            margin-top: 0.5rem;
        }

        .powerup-item {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 0.6rem;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            transition: all 0.2s;
        }

        .powerup-item:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-gold);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            color: #0b0f19;
            border: none;
            padding: 1rem 1.75rem;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-gold-glow);
            transition: all 0.2s;
            width: 100%;
            text-align: center;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px var(--accent-gold-glow);
        }

        .activity-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            width: 100%;
        }

        .activity-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1rem 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .activity-card.active, .activity-card:hover {
            background: rgba(0, 229, 255, 0.15);
            border-color: var(--accent-cyan);
        }

        .activity-card h4 {
            font-size: 0.85rem;
            margin-top: 0.4rem;
        }
    </style>
</head>
<body>

    <!-- p5.js Background & Terrain Engine Canvas -->
    <div id="p5-canvas-container"></div>

    <!-- Glassmorphism UI Root Overlay -->
    <div class="ui-root">
        
        <!-- Header HUD -->
        <header class="hud glass-panel interactive">
            <div class="hud-stat">
                <div class="hud-badge">
                    <span>🪙</span>
                    <span id="hud-coins" class="gold-text">250</span>
                </div>
            </div>
            <div class="hud-stat">
                <div class="hud-badge">
                    <span id="hud-activity-icon">⛰️</span>
                    <span id="hud-altitude" class="cyan-text">120m</span>
                </div>
            </div>
            <div class="hud-stat">
                <div class="hud-badge">
                    <span>🔥</span>
                    <span id="hud-streak" class="purple-text">0x</span>
                </div>
            </div>
        </header>

        <!-- Main Screen Container -->
        <main>
            
            <!-- Menu / Terrain Switcher Screen -->
            <section id="screen-menu" class="screen glass-panel interactive active">
                <h2 class="card-title">Choose Your Expedition</h2>
                <p class="card-subtitle">Select a 2D terrain traversal mode to challenge biblical question tiers.</p>
                
                <div class="activity-grid">
                    <div class="activity-card active" onclick="selectActivity('MOUNTAIN')">
                        <span style="font-size: 1.5rem;">⛰️</span>
                        <h4>Mountain</h4>
                    </div>
                    <div class="activity-card" onclick="selectActivity('RIVER')">
                        <span style="font-size: 1.5rem;">🚣</span>
                        <h4>River</h4>
                    </div>
                    <div class="activity-card" onclick="selectActivity('DESERT')">
                        <span style="font-size: 1.5rem;">🏜️</span>
                        <h4>Desert</h4>
                    </div>
                </div>

                <button class="btn-primary" onclick="startQuiz()">Begin Quest</button>
            </section>

            <!-- Quiz Screen -->
            <section id="screen-quiz" class="screen glass-panel interactive">
                <div class="timer-bar-container">
                    <div id="timer-bar" class="timer-bar"></div>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <p id="book-tag" class="card-subtitle" style="text-transform: uppercase; font-weight:700; color: var(--accent-cyan);">Genesis</p>
                    <span id="tier-badge" class="tier-badge tier-1">Tier 1 • Easy</span>
                </div>

                <h3 id="question-text" class="question-text">Loading question...</h3>

                <div id="options-grid" class="options-grid">
                    <!-- Dynamic Options Populated by JS -->
                </div>

                <!-- Marketplace Quick Power-Ups Bar -->
                <div class="powerup-bar">
                    <div class="powerup-item" onclick="usePowerup('hint')">
                        <span>💡 Hint</span>
                        <span class="gold-text">20 🪙</span>
                    </div>
                    <div class="powerup-item" onclick="usePowerup('shield')">
                        <span>🛡️ Shield</span>
                        <span class="gold-text">35 🪙</span>
                    </div>
                    <div class="powerup-item" onclick="usePowerup('freeze')">
                        <span>❄️ Freeze</span>
                        <span class="gold-text">15 🪙</span>
                    </div>
                </div>
            </section>

        </main>

        <!-- Footer Spacer -->
        <footer style="height: 10px;"></footer>
    </div>

    <script>
        /* ===================================================
           1. TIERED QUESTION DATABASE & CONFIGURATION
           =================================================== */
        const TIER_CONFIG = {
            1: { name: "Tier 1 • Easy", class: "tier-1", timeLimit: 20, reward: 15, penalty: 5, altitudeGain: 25 },
            2: { name: "Tier 2 • Medium", class: "tier-2", timeLimit: 14, reward: 30, penalty: 12, altitudeGain: 50 },
            3: { name: "Tier 3 • Hard", class: "tier-3", timeLimit: 9, reward: 60, penalty: 25, altitudeGain: 100 }
        };

        const questionDatabase = [
            // Tier 1 Questions
            { tier: 1, book: "Genesis", question: "On which mountain did Noah's Ark come to rest after the flood?", options: ["Mount Sinai", "Mount Ararat", "Mount Carmel", "Mount Nebo"], correct: 1, hint: "Located in modern-day Turkey." },
            { tier: 1, book: "Genesis", question: "What was the name of Abraham's original home city?", options: ["Ur", "Babylon", "Jericho", "Sodom"], correct: 0, hint: "A short, 2-letter ancient Sumerian city." },
            { tier: 1, book: "Exodus", question: "Through which body of water did Moses lead the Israelites?", options: ["Dead Sea", "Sea of Galilee", "Red Sea", "Jordan River"], correct: 2, hint: "Named after a vivid color." },
            
            // Tier 2 Questions
            { tier: 2, book: "Exodus", question: "What was the first plate brought upon Egypt?", options: ["Frogs", "Water turned to Blood", "Locusts", "Darkness"], correct: 1, hint: "Affects the Nile River." },
            { tier: 2, book: "Joshua", question: "How many days did the Israelites march around Jericho before the walls fell?", options: ["3 Days", "7 Days", "12 Days", "40 Days"], correct: 1, hint: "A biblically significant number associated with completion." },
            
            // Tier 3 Questions
            { tier: 3, book: "Daniel", question: "What were the Babylonian names given to Hananiah, Mishael, and Azariah?", options: ["Abednego, Shadrach, Meshach", "Shadrach, Meshach, Abednego", "Balthazar, Belteshazzar, Darius", "Elam, Cyrus, Artaxerxes"], correct: 1, hint: "Shadrach comes first in the standard ordering." }
        ];

        /* ===================================================
           2. GAME STATE & SYSTEM LOGIC
           =================================================== */
        let gameState = {
            coins: 250,
            altitude: 0,
            streak: 0,
            hasShield: false,
            currentActivity: 'MOUNTAIN', // 'MOUNTAIN', 'RIVER', 'DESERT'
            currentQuestion: null,
            timeRemaining: 100,
            timerInterval: null
        };

        // 2D Avatar Procedural Motion State
        let avatar = {
            x: 80,
            y: 0,
            targetX: 80,
            speed: 0.05,
            stepFrame: 0,
            isMoving: false
        };

        function updateHUD() {
            document.getElementById('hud-coins').innerText = gameState.coins;
            document.getElementById('hud-altitude').innerText = gameState.altitude + 'm';
            document.getElementById('hud-streak').innerText = gameState.streak + 'x';
            
            const icons = { 'MOUNTAIN': '⛰️', 'RIVER': '🚣', 'DESERT': '🏜️' };
            document.getElementById('hud-activity-icon').innerText = icons[gameState.currentActivity];
        }

        function setScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function selectActivity(type) {
            gameState.currentActivity = type;
            document.querySelectorAll('.activity-card').forEach(card => card.classList.remove('active'));
            event.currentTarget.classList.add('active');
            updateHUD();
        }

        function determineCurrentTier() {
            if (gameState.streak >= 4) return 3;
            if (gameState.streak >= 2) return 2;
            return 1;
        }

        function startQuiz() {
            setScreen('screen-quiz');
            loadNextQuestion();
        }

        function loadNextQuestion() {
            const currentTierNum = determineCurrentTier();
            const tierQuestions = questionDatabase.filter(q => q.tier === currentTierNum);
            
            // Fallback to any question if pool is exhausted
            const pool = tierQuestions.length > 0 ? tierQuestions : questionDatabase;
            gameState.currentQuestion = pool[Math.floor(Math.random() * pool.length)];

            const q = gameState.currentQuestion;
            const tierInfo = TIER_CONFIG[q.tier];

            // Render Tier UI
            const badgeEl = document.getElementById('tier-badge');
            badgeEl.innerText = tierInfo.name;
            badgeEl.className = `tier-badge ${tierInfo.class}`;

            document.getElementById('book-tag').innerText = q.book;
            document.getElementById('question-text').innerText = q.question;

            // Render Options
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span>${opt}</span><span style="opacity:0.4;">${['A','B','C','D'][idx]}</span>`;
                btn.onclick = () => checkAnswer(idx, btn);
                grid.appendChild(btn);
            });

            startTimer(tierInfo.timeLimit);
        }

        function checkAnswer(selectedIdx, btnElement) {
            clearInterval(gameState.timerInterval);
            const q = gameState.currentQuestion;
            const tierInfo = TIER_CONFIG[q.tier];

            if (selectedIdx === q.correct) {
                btnElement.classList.add('correct');
                gameState.coins += tierInfo.reward;
                gameState.altitude += tierInfo.altitudeGain;
                gameState.streak += 1;
                
                // Trigger Avatar Procedural Forward Movement
                triggerAvatarMove();

            } else {
                btnElement.classList.add('wrong');
                if (gameState.hasShield) {
                    gameState.hasShield = false;
                    alert("🛡️ Shield protected your coins and streak!");
                } else {
                    gameState.coins = Math.max(0, gameState.coins - tierInfo.penalty);
                    gameState.streak = 0;
                }
            }

            updateHUD();

            setTimeout(() => {
                loadNextQuestion();
            }, 1200);
        }

        function startTimer(seconds) {
            clearInterval(gameState.timerInterval);
            let timeRemaining = 100;
            const timerBar = document.getElementById('timer-bar');
            const step = 100 / (seconds * 10);

            gameState.timerInterval = setInterval(() => {
                timeRemaining -= step;
                timerBar.style.width = Math.max(0, timeRemaining) + '%';

                if (timeRemaining <= 0) {
                    clearInterval(gameState.timerInterval);
                    const tierInfo = TIER_CONFIG[gameState.currentQuestion.tier];
                    gameState.coins = Math.max(0, gameState.coins - tierInfo.penalty);
                    gameState.streak = 0;
                    updateHUD();
                    loadNextQuestion();
                }
            }, 100);
        }

        function triggerAvatarMove() {
            avatar.isMoving = true;
            // Advance avatar across screen canvas
            avatar.targetX += (window.innerWidth * 0.15);
            
            // Loop avatar back across canvas seamlessly when reaching end
            if (avatar.targetX > window.innerWidth * 0.85) {
                avatar.targetX = window.innerWidth * 0.15;
                avatar.x = window.innerWidth * 0.05;
            }
        }

        function usePowerup(type) {
            if (type === 'hint' && gameState.coins >= 20) {
                gameState.coins -= 20;
                alert(`💡 Hint: ${gameState.currentQuestion.hint}`);
            } else if (type === 'freeze' && gameState.coins >= 15) {
                gameState.coins -= 15;
                clearInterval(gameState.timerInterval);
            } else if (type === 'shield' && gameState.coins >= 35) {
                gameState.coins -= 35;
                gameState.hasShield = true;
                alert("🛡️ Shield equipped for next incorrect answer!");
            } else {
                alert("Not enough coins!");
            }
            updateHUD();
        }

        /* ===================================================
           3. p5.js CANVAS & PROCEDURAL 2D AVATAR ENGINE
           =================================================== */
        let particles = [];

        function setup() {
            let canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent('p5-canvas-container');

            // Initialize atmospheric background particles
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: random(width),
                    y: random(height),
                    size: random(2, 5),
                    speedY: random(0.2, 0.8),
                    opacity: random(60, 180)
                });
            }

            avatar.x = width * 0.15;
            avatar.targetX = width * 0.15;
        }

        function draw() {
            // Render Selected Terrain
            if (gameState.currentActivity === 'MOUNTAIN') {
                background(12, 17, 30);
                drawMountainTerrain();
            } else if (gameState.currentActivity === 'RIVER') {
                background(8, 22, 36);
                drawRiverTerrain();
            } else if (gameState.currentActivity === 'DESERT') {
                background(30, 18, 12);
                drawDesertTerrain();
            }

            // Update & Render Avatar Procedural Motion
            updateAvatarPosition();
            drawProceduralAvatar();

            // Atmospheric Particle FX
            drawParticles();
        }

        /* Terrain Curve Snap Logic */
        function getTerrainY(x, type) {
            if (type === 'MOUNTAIN') {
                return height - 80 - noise(x * 0.008) * 90;
            } else if (type === 'RIVER') {
                return height - 110 + sin(frameCount * 0.04 + x * 0.01) * 6;
            } else if (type === 'DESERT') {
                return height - 90 - sin(x * 0.006) * 35;
            }
        }

        function updateAvatarPosition() {
            // Lerp avatar X position smoothly towards target
            avatar.x = lerp(avatar.x, avatar.targetX, avatar.speed);
            
            // Snap Y directly to current terrain height curve
            avatar.y = getTerrainY(avatar.x, gameState.currentActivity);

            if (abs(avatar.x - avatar.targetX) < 1) {
                avatar.isMoving = false;
            }

            if (avatar.isMoving) {
                avatar.stepFrame += 0.2;
            }
        }

        /* Draw Procedural 2D Character Avatar */
        function drawProceduralAvatar() {
            push();
            translate(avatar.x, avatar.y);

            if (gameState.currentActivity === 'MOUNTAIN') {
                // Mountain Climber Avatar
                let legOffset = sin(avatar.stepFrame * 2) * 5;
                
                // Shadow
                fill(0, 0, 0, 60);
                ellipse(0, 5, 24, 8);

                // Legs
                stroke(255); strokeWeight(3);
                line(-4, -5, -6 + legOffset, 4);
                line(4, -5, 6 - legOffset, 4);

                // Body & Cloak
                noStroke();
                fill(0, 229, 255); // Cyan Tunic
                rect(-8, -24, 16, 18, 4);

                // Head
                fill(255, 205, 148);
                ellipse(0, -30, 14, 14);

                // Walking Stick / Staff
                stroke(255, 193, 7); strokeWeight(2);
                line(8, -32, 10 + legOffset, 6);

            } else if (gameState.currentActivity === 'RIVER') {
                // Boat & Rower Avatar
                let waveBob = sin(frameCount * 0.08) * 3;
                translate(0, waveBob);

                // Boat Hull
                noStroke();
                fill(160, 82, 45);
                arc(0, -2, 46, 22, 0, PI);

                // Rower
                fill(255, 205, 148);
                ellipse(-4, -16, 12, 12); // Head
                fill(168, 85, 247); // Purple Tunic
                rect(-10, -10, 12, 12, 3);

                // Oar Rowing Motion
                stroke(255); strokeWeight(2.5);
                let oarAngle = sin(frameCount * 0.1) * 0.5;
                line(-2, -8, 18 * cos(oarAngle), 12 * sin(oarAngle) + 6);

            } else if (gameState.currentActivity === 'DESERT') {
                // Desert Traveler Avatar
                let bounce = abs(sin(avatar.stepFrame)) * 3;
                translate(0, -bounce);

                // Shadow
                fill(0, 0, 0, 50);
                ellipse(0, 4, 28, 6);

                // Cloak / Robe
                noStroke();
                fill(255, 193, 7);
                triangle(-10, 2, 10, 2, 0, -28);

                // Head turban
                fill(245);
                ellipse(0, -26, 14, 12);
            }

            pop();
        }

        /* Environment Render Functions */
        function drawMountainTerrain() {
            noStroke();
            // Background Mountains
            fill(22, 30, 50);
            beginShape();
            vertex(0, height);
            for (let x = 0; x <= width; x += 40) {
                let y = height - 160 - noise(x * 0.004) * 140;
                vertex(x, y);
            }
            vertex(width, height);
            endShape(CLOSE);

            // Foreground Path Mountain Ridge
            fill(32, 44, 70);
            beginShape();
            vertex(0, height);
            for (let x = 0; x <= width; x += 20) {
                let y = getTerrainY(x, 'MOUNTAIN');
                vertex(x, y + 10);
            }
            vertex(width, height);
            endShape(CLOSE);
        }

        function drawRiverTerrain() {
            noStroke();
            // River Water Base
            fill(0, 119, 182, 90);
            rect(0, height - 140, width, 140);

            // Animated Waves
            fill(0, 180, 216, 120);
            beginShape();
            vertex(0, height);
            for (let x = 0; x <= width; x += 20) {
                let y = getTerrainY(x, 'RIVER') + 8;
                vertex(x, y);
            }
            vertex(width, height);
            endShape(CLOSE);
        }

        function drawDesertTerrain() {
            noStroke();
            // Background Dunes
            fill(180, 100, 45);
            beginShape();
            vertex(0, height);
            for (let x = 0; x <= width; x += 50) {
                let y = height - 130 - sin(x * 0.003) * 40;
                vertex(x, y);
            }
            vertex(width, height);
            endShape(CLOSE);

            // Foreground Dunes
            fill(220, 135, 55);
            beginShape();
            vertex(0, height);
            for (let x = 0; x <= width; x += 20) {
                let y = getTerrainY(x, 'DESERT') + 12;
                vertex(x, y);
            }
            vertex(width, height);
            endShape(CLOSE);
        }

        function drawParticles() {
            noStroke();
            particles.forEach(p => {
                fill(255, 215, 0, p.opacity);
                ellipse(p.x, p.y, p.size);
                p.y -= p.speedY;
                if (p.y < 0) p.y = height;
            });
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
