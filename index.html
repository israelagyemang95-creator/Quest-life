<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Quest: Adventure & Tiered Trivia</title>
    <!-- p5.js Library for 2D Canvas Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(18, 22, 38, 0.75);
            --glass-border: rgba(255, 255, 255, 0.14);
            --accent-gold: #ffc107;
            --accent-gold-glow: rgba(255, 193, 7, 0.35);
            --accent-cyan: #00e5ff;
            --accent-purple: #a855f7;
            --danger-red: #ff4757;
            --success-green: #2ed573;
            --tier-easy: #2ed573;
            --tier-medium: #ff9f43;
            --tier-hard: #ff4757;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090c15;
            color: var(--text-main);
        }

        /* p5.js Canvas Container */
        #p5-canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Glassmorphism UI Root Overlay */
        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Reusable Glass Panel Styling */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        }

        /* Header HUD */
        header.hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1.25rem;
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            position: relative;
        }

        .hud-stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .hud-badge {
            background: rgba(255, 255, 255, 0.08);
            padding: 0.4rem 0.85rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .gold-text { color: var(--accent-gold); }
        .cyan-text { color: var(--accent-cyan); }
        .purple-text { color: var(--accent-purple); }

        /* Save Flash Badge */
        #save-toast {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-cyan);
            color: #090c15;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 0.2rem 0.6rem;
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.3s ease, top 0.3s ease;
            pointer-events: none;
        }

        #save-toast.show {
            opacity: 1;
            top: -20px;
        }

        /* Game Screens Switcher */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 520px;
            margin: auto;
            padding: 1.75rem;
            gap: 1.1rem;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.3px;
        }

        .card-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Stats Row */
        .stats-summary {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 0.75rem;
            text-align: center;
        }

        .stat-item h5 {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-item p {
            font-size: 1.1rem;
            font-weight: 800;
            margin-top: 0.2rem;
        }

        /* Tier Pill Badge */
        .tier-badge {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: inline-block;
        }

        .tier-badge.tier-1 { color: var(--tier-easy); border-color: var(--tier-easy); }
        .tier-badge.tier-2 { color: var(--tier-medium); border-color: var(--tier-medium); }
        .tier-badge.tier-3 { color: var(--tier-hard); border-color: var(--tier-hard); }

        /* Quiz UI Elements */
        .timer-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 0.25rem;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-gold));
            transition: width 0.1s linear;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.5;
            text-align: center;
            margin: 0.25rem 0 0.75rem 0;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            padding: 0.9rem 1.25rem;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.92rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent-cyan);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: rgba(46, 213, 115, 0.25) !important;
            border-color: var(--success-green) !important;
        }

        .option-btn.wrong {
            background: rgba(255, 71, 87, 0.25) !important;
            border-color: var(--danger-red) !important;
        }

        /* Power-Up Quick Marketplace Bar */
        .powerup-bar {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            justify-content: space-between;
            margin-top: 0.5rem;
        }

        .powerup-item {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 0.6rem;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            transition: all 0.2s;
        }

        .powerup-item:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-gold);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            color: #0b0f19;
            border: none;
            padding: 1rem 1.75rem;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-gold-glow);
            transition: all 0.2s;
            width: 100%;
            text-align: center;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px var(--accent-gold-glow);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            color: var(--danger-red);
            border-color: var(--danger-red);
        }

        .activity-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            width: 100%;
        }

        .activity-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1rem 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .activity-card.active, .activity-card:hover {
            background: rgba(0, 229, 255, 0.15);
            border-color: var(--accent-cyan);
        }

        .activity-card h4 {
            font-size: 0.85rem;
            margin-top: 0.4rem;
        }
    </style>
</head>
<body>

    <!-- p5.js Background & Terrain Engine Canvas -->
    <div id="p5-canvas-container"></div>

    <!-- Glassmorphism UI Root Overlay -->
    <div class="ui-root">
        
        <!-- Header HUD -->
        <header class="hud glass-panel interactive">
            <div id="save-toast">SAVED</div>

            <div class="hud-stat">
                <div class="hud-badge">
                    <span>🪙</span>
                    <span id="hud-coins" class="gold-text">250</span>
                </div>
            </div>
            <div class="hud-stat">
                <div class="hud-badge">
                    <span id="hud-activity-icon">⛰️</span>
                    <span id="hud-altitude" class="cyan-text">0m</span>
                </div>
            </div>
            <div class="hud-stat">
                <div class="hud-badge">
                    <span>🔥</span>
                    <span id="hud-streak" class="purple-text">0x</span>
                </div>
            </div>
        </header>

        <!-- Main Screen Container -->
        <main>
            
            <!-- Menu / Terrain Switcher Screen -->
            <section id="screen-menu" class="screen glass-panel interactive active">
                <h2 class="card-title">Choose Your Expedition</h2>
                <p class="card-subtitle">Select a 2D terrain traversal mode to challenge biblical question tiers.</p>
                
                <div class="activity-grid">
                    <div class="activity-card active" onclick="selectActivity('MOUNTAIN')">
                        <span style="font-size: 1.5rem;">⛰️</span>
                        <h4>Mountain</h4>
                    </div>
                    <div class="activity-card" onclick="selectActivity('RIVER')">
                        <span style="font-size: 1.5rem;">🚣</span>
                        <h4>River</h4>
                    </div>
                    <div class="activity-card" onclick="selectActivity('DESERT')">
                        <span style="font-size: 1.5rem;">🏜️</span>
                        <h4>Desert</h4>
                    </div>
                </div>

                <!-- Career Progress Summary -->
                <div class="stats-summary">
                    <div class="stat-item">
                        <h5>Max Peak</h5>
                        <p id="stat-max-alt" class="cyan-text">0m</p>
                    </div>
                    <div class="stat-item">
                        <h5>Best Streak</h5>
                        <p id="stat-high-streak" class="purple-text">0x</p>
                    </div>
                    <div class="stat-item">
                        <h5>Solved</h5>
                        <p id="stat-solved" class="gold-text">0</p>
                    </div>
                </div>

                <button class="btn-primary" onclick="startQuiz()">Begin Quest</button>
                <button class="btn-secondary" onclick="resetProgress()">Reset Saved Data</button>
            </section>

            <!-- Quiz Screen -->
            <section id="screen-quiz" class="screen glass-panel interactive">
                <div class="timer-bar-container">
                    <div id="timer-bar" class="timer-bar"></div>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <p id="book-tag" class="card-subtitle" style="text-transform: uppercase; font-weight:700; color: var(--accent-cyan);">Genesis</p>
                    <span id="tier-badge" class="tier-badge tier-1">Tier 1 • Easy</span>
                </div>

                <h3 id="question-text" class="question-text">Loading question...</h3>

                <div id="options-grid" class="options-grid">
                    <!-- Dynamic Options Populated by JS -->
                </div>

                <!-- Marketplace Quick Power-Ups Bar -->
                <div class="powerup-bar">
                    <div class="powerup-item" onclick="usePowerup('hint')">
                        <span>💡 Hint</span>
                        <span class="gold-text">20 🪙</span>
                    </div>
                    <div class="powerup-item" onclick="usePowerup('shield')">
                        <span>🛡️ Shield</span>
                        <span class="gold-text">35 🪙</span>
                    </div>
                    <div class="powerup-item" onclick="usePowerup('freeze')">
                        <span>❄️ Freeze</span>
                        <span class="gold-text">15 🪙</span>
                    </div>
                </div>
            </section>

        </main>

        <!-- Footer Spacer -->
        <footer style="height: 10px;"></footer>
    </div>

    <script>
        /* ===================================================
           1. TIERED QUESTION DATABASE & CONFIGURATION
           =================================================== */
        const TIER_CONFIG = {
            1: { name: "Tier 1 • Easy", class: "tier-1", timeLimit: 20, reward: 15, penalty: 5, altitudeGain: 25 },
            2: { name: "Tier 2 • Medium", class: "tier-2", timeLimit: 14, reward: 30, penalty: 12, altitudeGain: 50 },
            3: { name: "Tier 3 • Hard", class: "tier-3", timeLimit: 9, reward: 60, penalty: 25, altitudeGain: 100 }
        };

        const questionDatabase = [
            // --- TIER 1 QUESTIONS ---
            { tier: 1, book: "Genesis", question: "On which mountain did Noah's Ark come to rest after the flood?", options: ["Mount Sinai", "Mount Ararat", "Mount Carmel", "Mount Nebo"], correct: 1, hint: "Located in modern-day Turkey." },
            { tier: 1, book: "Genesis", question: "What was the name of Abraham's original home city?", options: ["Ur", "Babylon", "Jericho", "Sodom"], correct: 0, hint: "A short, 2-letter ancient Sumerian city." },
            { tier: 1, book: "Exodus", question: "Through which body of water did Moses lead the Israelites?", options: ["Dead Sea", "Sea of Galilee", "Red Sea", "Jordan River"], correct: 2, hint: "Named after a vivid color." },
            { tier: 1, book: "Matthew", question: "In which city was Jesus born?", options: ["Nazareth", "Jerusalem", "Bethlehem", "Capernaum"], correct: 2, hint: "Known as the City of David." },
            { tier: 1, book: "Psalms", question: "'The Lord is my shepherd; I shall not want' is the first line of which Psalm?", options: ["Psalm 1", "Psalm 23", "Psalm 91", "Psalm 119"], correct: 1, hint: "A famous Psalm numbered in the low twenties." },

            // --- TIER 2 QUESTIONS ---
            { tier: 2, book: "Exodus", question: "What was the first plague brought upon Egypt?", options: ["Frogs", "Water turned to Blood", "Locusts", "Darkness"], correct: 1, hint: "Affects the Nile River." },
            { tier: 2, book: "Joshua", question: "How many days did the Israelites march around Jericho before the walls fell?", options: ["3 Days", "7 Days", "12 Days", "40 Days"], correct: 1, hint: "A biblically significant number associated with completion." },
            { tier: 2, book: "Luke", question: "What was the occupation of Zacchaeus before he met Jesus?", options: ["Fisherman", "Tax Collector", "Tentmaker", "Pharisee"], correct: 1, hint: "He climbed a sycamore tree to see Jesus." },
            { tier: 2, book: "Acts", question: "On the road to which city was Saul converted?", options: ["Antioch", "Damascus", "Rome", "Ephesus"], correct: 1, hint: "Capital city of modern Syria." },

            // --- TIER 3 QUESTIONS ---
            { tier: 3, book: "Daniel", question: "What were the Babylonian names given to Hananiah, Mishael, and Azariah?", options: ["Abednego, Shadrach, Meshach", "Shadrach, Meshach, Abednego", "Balthazar, Belteshazzar, Darius", "Elam, Cyrus, Artaxerxes"], correct: 1, hint: "Shadrach comes first in the standard ordering." },
            { tier: 3, book: "Revelation", question: "Which of the Seven Churches of Asia was called 'lukewarm'?", options: ["Ephesus", "Smyrna", "Laodicea", "Philadelphia"], correct: 2, hint: "Neither hot nor cold." },
            { tier: 3, book: "Acts", question: "Who was the first Christian martyr recorded in the Book of Acts?", options: ["James", "Stephen", "Philip", "Barnabas"], correct: 1, hint: "One of the original seven deacons, stoned to death." }
        ];

        /* ===================================================
           2. LOCAL STORAGE PERSISTENCE ENGINE
           =================================================== */
        const STORAGE_KEY = "BIBLE_QUEST_GAME_SAVE_V1";

        let gameState = {
            coins: 250,
            altitude: 0,
            maxAltitude: 0,
            streak: 0,
            highStreak: 0,
            solvedCount: 0,
            hasShield: false,
            currentActivity: 'MOUNTAIN', // 'MOUNTAIN', 'RIVER', 'DESERT'
            currentQuestion: null,
            timerInterval: null
        };

        function saveProgress() {
            const dataToSave = {
                coins: gameState.coins,
                altitude: gameState.altitude,
                maxAltitude: gameState.maxAltitude,
                streak: gameState.streak,
                highStreak: gameState.highStreak,
                solvedCount: gameState.solvedCount
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
            
            // Trigger visual save toast
            const toast = document.getElementById('save-toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1200);
        }

        function loadProgress() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    gameState.coins = parsed.coins ?? 250;
                    gameState.altitude = parsed.altitude ?? 0;
                    gameState.maxAltitude = parsed.maxAltitude ?? 0;
                    gameState.streak = parsed.streak ?? 0;
                    gameState.highStreak = parsed.highStreak ?? 0;
                    gameState.solvedCount = parsed.solvedCount ?? 0;
                } catch(e) {
                    console.error("Error loading save data", e);
                }
            }
            updateHUD();
            updateMenuStats();
        }

        function resetProgress() {
            if (confirm("Are you sure you want to reset all coins, altitude, and high score progress?")) {
                localStorage.removeItem(STORAGE_KEY);
                gameState.coins = 250;
                gameState.altitude = 0;
                gameState.maxAltitude = 0;
                gameState.streak = 0;
                gameState.highStreak = 0;
                gameState.solvedCount = 0;
                updateHUD();
                updateMenuStats();
                alert("Progress reset to default!");
            }
        }

        /* ===================================================
           3. SYSTEM & UI LOGIC
           =================================================== */
        // 2D Avatar Procedural Motion State
        let avatar = {
            x: 80,
            y: 0,
            targetX: 80,
            speed: 0.05,
            stepFrame: 0,
            isMoving: false
        };

        function updateHUD() {
            document.getElementById('hud-coins').innerText = gameState.coins;
            document.getElementById('hud-altitude').innerText = gameState.altitude + 'm';
            document.getElementById('hud-streak').innerText = gameState.streak + 'x';
            
            const icons = { 'MOUNTAIN': '⛰️', 'RIVER': '🚣', 'DESERT': '🏜️' };
            document.getElementById('hud-activity-icon').innerText = icons[gameState.currentActivity];
        }

        function updateMenuStats() {
            document.getElementById('stat-max-alt').innerText = gameState.maxAltitude + 'm';
            document.getElementById('stat-high-streak').innerText = gameState.highStreak + 'x';
            document.getElementById('stat-solved').innerText = gameState.solvedCount;
        }

        function setScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function selectActivity(type) {
            gameState.currentActivity = type;
            document.querySelectorAll('.activity-card').forEach(card => card.classList.remove('active'));
            event.currentTarget.classList.add('active');
            updateHUD();
        }

        function determineCurrentTier() {
            if (gameState.streak >= 4) return 3;
            if (gameState.streak >= 2) return 2;
            return 1;
        }

        function startQuiz() {
            setScreen('screen-quiz');
            loadNextQuestion();
        }

        function loadNextQuestion() {
            const currentTierNum = determineCurrentTier();
            const tierQuestions = questionDatabase.filter(q => q.tier === currentTierNum);
            
            const pool = tierQuestions.length > 0 ? tierQuestions : questionDatabase;
            gameState.currentQuestion = pool[Math.floor(Math.random() * pool.length)];

            const q = gameState.currentQuestion;
            const tierInfo = TIER_CONFIG[q.tier];

            // Render Tier UI
            const badgeEl = document.getElementById('tier-badge');
            badgeEl.innerText = tierInfo.name;
            badgeEl.className = `tier-badge ${tierInfo.class}`;

            document.getElementById('book-tag').innerText = q.book;
            document.getElementById('question-text').innerText = q.question;

            // Render Options
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span>${opt}</span><span style="opacity:0.4;">${['A','B','C','D'][idx]}</span>`;
                btn.onclick = () => checkAnswer(idx, btn);
                grid.appendChild(btn);
            });

            startTimer(tierInfo.timeLimit);
        }

        function checkAnswer(selectedIdx, btnElement) {
            clearInterval(gameState.timerInterval);
            const q = gameState.currentQuestion;
            const tierInfo = TIER_CONFIG[q.tier];

            if (selectedIdx === q.correct) {
                btnElement.classList.add('correct');
                gameState.coins += tierInfo.reward;
                gameState.altitude += tierInfo.altitudeGain;
                gameState.streak += 1;
                gameState.solvedCount += 1;
                
                if (gameState.altitude > gameState.maxAltitude) {
                    gameState.maxAltitude = gameState.altitude;
                }
                if (gameState.streak > gameState.highStreak) {
                    gameState.highStreak = gameState.streak;
                }
                
                triggerAvatarMove();

            } else {
                btnElement.classList.add('wrong');
                if (gameState.hasShield) {
                    gameState.hasShield = false;
                    alert("🛡️ Shield protected your coins and streak!");
                } else {
                    gameState.coins = Math.max(0, gameState.coins - tierInfo.penalty);
                    gameState.streak = 0;
                }
            }

            updateHUD();
            updateMenuStats();
            saveProgress(); // Persist changes

            setTimeout(() => {
                loadNextQuestion();
            }, 1200);
        }

        function startTimer(seconds) {
            clearInterval(gameState.timerInterval);
            let timeRemaining = 100;
            const timerBar = document.getElementById('timer-bar');
            const step = 100 / (seconds * 10);

            gameState.timerInterval = setInterval(() => {
                timeRemaining -= step;
                timerBar.style.width = Math.max(0, timeRemaining) + '%';

                if (timeRemaining <= 0) {
                    clearInterval(gameState.timerInterval);
                    const tierInfo = TIER_CONFIG[gameState.currentQuestion.tier];
                    gameState.coins = Math.max(0, gameState.coins - tierInfo.penalty);
                    gameState.streak = 0;
                    updateHUD();
                    saveProgress();
                    loadNextQuestion();
                }
            }, 100);
        }

        function triggerAvatarMove() {
            avatar.isMoving = true;
            avatar.targetX += (window.innerWidth * 0.15);
            
            if (avatar.targetX > window.innerWidth * 0.85) {
                avatar.targetX = window.innerWidth * 0.15;
                avatar.x = window.innerWidth * 0.05;
            }
        }

        function usePowerup(type) {
            if (type === 'hint' && gameState.coins >= 20) {
                gameState.coins -= 20;
                alert(`💡 Hint: ${gameState.currentQuestion.hint}`);
            } else if (type === 'freeze' && gameState.coins >= 15) {
                gameState.coins -= 15;
                clearInterval(gameState.timerInterval);
            } else if (type === 'shield' && gameState.coins >= 35) {
                gameState.coins -= 35;
                gameState.hasShield = true;
                alert("🛡️ Shield equipped for next incorrect answer!");
            } else {
                alert("Not enough coins!");
            }
            updateHUD();
            saveProgress();
        }

        /* ===================================================
           4. p5.js CANVAS & PROCEDURAL 2D AVATAR ENGINE
           =================================================== */
        let particles = [];

        function setup() {
            let canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent('p5-canvas-container');

            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: random(width),
                    y: random(height),
                    size: random(2, 5),
                    speedY: random(0.2, 0.8),
                    opacity: random(60, 180)
                });
            }

            avatar.x = width * 0.15;
            avatar.targetX = width * 0.15;

            // Load saved local storage progress on initial boot
            loadProgress();
        }

        function draw() {
            if (gameState.currentActivity === 'MOUNTAIN') {
                background(12, 17, 30);
                drawMountainTerrain();
            } else if (gameState.currentActivity === 'RIVER') {
                background(8, 22, 36);
                drawRiverTerrain();
            } else if (gameState.currentActivity === 'DESERT') {
                background(30, 18, 12);
                drawDesertTerrain();
            }

            updateAvatarPosition();
            drawProceduralAvatar();
            drawParticles();
        }

        function getTerrainY(x, type) {
            if (type === 'MOUNTAIN') {
                return height - 80 - noise(x * 0.008) * 90;
            } else if (type === 'RIVER') {
                return height - 110 + sin(frameCount * 0.04 + x * 0.01) * 6;
            } else if (type === 'DESERT') {
                return height - 90 - sin(x * 0.006) * 35;
            }
        }

        function updateAvatarPosition() {
            avatar.x = lerp(avatar.x, avatar.targetX, avatar.speed);
            avatar.y = getTerrainY(avatar.x, gameState.currentActivity);

            if (abs(avatar.x - avatar.targetX) < 1) {
                avatar.isMoving = false;
            }

            if (avatar.isMoving) {
                avatar.stepFrame += 0.2;
            }
        }

        function drawProceduralAvatar() {
            push();
            translate(avatar.x, avatar.y);

            if (gameState.currentActivity === 'MOUNTAIN') {
                let legOffset = sin(avatar.stepFrame * 2) * 5;
                fill(0, 0, 0, 60); ellipse(0, 5, 24, 8);
                stroke(255); strokeWeight(3);
                line(-4, -5, -6 + legOffset, 4);
                line(4, -5, 6 - legOffset, 4);
                noStroke(); fill(0, 229, 255);
                rect(-8, -24, 16, 18, 4);
                fill(255, 205, 148); ellipse(0, -30, 14, 14);
                stroke(255, 193, 7); strokeWeight(2);
                line(8, -32, 10 + legOffset, 6);

            } else if (gameState.currentActivity === 'RIVER') {
                let waveBob = sin(frameCount * 0.08) * 3;
                translate(0, waveBob);
                noStroke(); fill(160, 82, 45);
                arc(0, -2, 46, 22, 0, PI);
                fill(255, 205, 148); ellipse(-4, -16, 12, 12);
                fill(168, 85, 247); rect(-10, -10, 12, 12, 3);
                stroke(255); strokeWeight(2.5);
                let oarAngle = sin(frameCount * 0.1) * 0.5;
                line(-2, -8, 18 * cos(oarAngle), 12 * sin(oarAngle) + 6);

            } else if (gameState.currentActivity === 'DESERT') {
                let bounce = abs(sin(avatar.stepFrame)) * 3;
                translate(0, -bounce);
                fill(0, 0, 0, 50); ellipse(0, 4, 28, 6);
                noStroke(); fill(255, 193, 7);
                triangle(-10, 2, 10, 2, 0, -28);
                fill(245); ellipse(0, -26, 14, 12);
            }

            pop();
        }

        function drawMountainTerrain() {
            noStroke();
            fill(22, 30, 50);
            beginShape();
            vertex(0, height);
            for (let x = 0; x <= width; x += 40) {
                let y = height - 160 - noise(x * 0.004) * 140;
                vertex(x, y);
            }
            vertex(width, height);
            endShape(CLOSE);

            fill(32, 44, 70);
            beginShape();
            vertex(0, height);
            for (let x = 0; x <= width; x += 20) {
                let y = getTerrainY(x, 'MOUNTAIN');
                vertex(x, y + 10);
            }
            vertex(width, height);
            endShape(CLOSE);
        }

        function drawRiverTerrain() {
            noStroke();
            fill(0, 119, 182, 90);
            rect(0, height - 140, width, 140);

            fill(0, 180, 216, 120);
            beginShape();
            vertex(0, height);
            for (let x = 0; x <= width; x += 20) {
                let y = getTerrainY(x, 'RIVER') + 8;
                vertex(x, y);
            }
            vertex(width, height);
            endShape(CLOSE);
        }

        function drawDesertTerrain() {
            noStroke();
            fill(180, 100, 45);
            beginShape();
            vertex(0, height);
            for (let x = 0; x <= width; x += 50) {
                let y = height - 130 - sin(x * 0.003) * 40;
                vertex(x, y);
            }
            vertex(width, height);
            endShape(CLOSE);

            fill(220, 135, 55);
            beginShape();
            vertex(0, height);
            for (let x = 0; x <= width; x += 20) {
                let y = getTerrainY(x, 'DESERT') + 12;
                vertex(x, y);
            }
            vertex(width, height);
            endShape(CLOSE);
        }

        function drawParticles() {
            noStroke();
            particles.forEach(p => {
                fill(255, 215, 0, p.opacity);
                ellipse(p.x, p.y, p.size);
                p.y -= p.speedY;
                if (p.y < 0) p.y = height;
            });
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
